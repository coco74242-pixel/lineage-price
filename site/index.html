<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>天堂經典版 天幣監測</title>

  <style>
    :root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1c1917;--muted:#78716c;--line:#e7e0d6;--teal:#0f766e;
      --red:#b91c1c;--red-bg:#fee2e2;--amber:#b45309;--amber-bg:#fef3c7;
      --t1:#15803d;--t1-fg:#fff;--t2:#bbf7d0;--t2-fg:#14532d;--t3:#fde68a;--t3-fg:#78350f;--t4:#eeeae4;--t4-fg:#57534e;}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"PingFang TC","Noto Sans TC","Source Han Sans TC","Microsoft JhengHei",ui-sans-serif,system-ui,sans-serif;
      background:var(--bg);color:var(--ink);font-size:13px;line-height:1.35;padding:10px 12px 14px}
    .wrap{max-width:1400px;margin:0 auto}
    .top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
    h1{font-size:1.05rem;margin:0 6px 0 0;white-space:nowrap}
    .sub{color:var(--muted);font-size:12px}
    .sub strong{color:var(--ink)}
    .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
    .chip b{color:var(--ink)}
    .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
    select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
    .legend{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
    .sw{display:inline-block;padding:1px 7px;border-radius:6px;font-weight:700;font-size:11.5px}
    .sw.tier1,.rate .tier1{background:var(--t1);color:var(--t1-fg)} .sw.tier2,.rate .tier2{background:var(--t2);color:var(--t2-fg)}
    .sw.tier3,.rate .tier3{background:var(--t3);color:var(--t3-fg)} .sw.tier4,.rate .tier4{background:var(--t4);color:var(--t4-fg)}
    .banner{border-radius:8px;padding:5px 10px;margin-bottom:6px;font-size:12px}
    .banner.error{background:var(--red-bg);color:var(--red)} .banner.warn{background:var(--amber-bg);color:var(--amber)}
    .banner ul{margin:2px 0 0;padding-left:1.1em}
    #list{display:grid;gap:10px;grid-template-columns:1fr}
    @media (min-width:1100px){#list.two{grid-template-columns:1fr 1fr}}
    table.t{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-variant-numeric:tabular-nums}
    .t th{background:#efe9df;color:var(--muted);font-weight:600;font-size:11.5px;text-align:left;padding:3px 6px;white-space:nowrap}
    .t td{padding:2px 6px;border-top:1px solid var(--line);white-space:nowrap;height:22px}
    .t td.num,.t th.num{text-align:right}
    .t td.rate{text-align:right;font-weight:800}
    .t tr.row-tier1 td{background:#dcfce7} .t tr.row-tier2 td{background:#f0fdf4} .t tr.row-tier3 td{background:#fffbeb} .t tr.row-tier4 td{background:var(--card)}
    .t tr td.rate span{display:inline-block;min-width:52px;text-align:right;padding:0 6px;border-radius:5px}
    .t tr.newsrv td{border-top:2px solid #d6cdbf}
    .srv{font-weight:600}
    .dim{color:var(--muted)}
    .t a{color:var(--teal);font-weight:700;text-decoration:none}
    .min{color:var(--amber);font-weight:700}
    .empty{text-align:center;color:var(--muted);padding:24px}
    details.refs{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 10px;margin-top:8px}
    details.refs>summary{cursor:pointer;font-weight:700;padding:5px 0;font-size:12.5px}
    #refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;padding-bottom:6px}
    #refs>p{grid-column:1/-1;margin:2px 0}
    .ref-item{border-top:1px solid var(--line);padding:4px 0}
    .ref-item h3{margin:0;font-size:12.5px}
    .ref-item .median{color:var(--muted);font-size:12px}
    .ref-item table{border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
    .ref-item td,.ref-item th{padding:0 8px 0 0;text-align:left}
    .ref-item th{color:var(--muted);font-weight:500}
    .note-wide{background:var(--amber-bg);color:var(--amber);border-radius:6px;padding:1px 6px;font-size:11px;margin-top:2px}
    footer{margin-top:8px;color:var(--muted);font-size:11.5px}
    @media (max-width:640px){
      body{padding:8px 6px}
      .t th,.t td{padding:2px 4px;font-size:12px}
      .t .hide-sm{display:none}
      .t tr td.rate span{min-width:42px;padding:0 3px}
      .t th,.t td{padding:2px 3px;font-size:11.5px}
      .t td.srv{white-space:normal;max-width:6.5em;line-height:1.15}
      .t td.cost{white-space:normal;line-height:1.15}
      .t td.cost .arr{display:block;height:0;overflow:hidden}
      .t .th-cost-l{display:none}
    }
    .t .th-cost-s{display:none}
    @media (max-width:640px){.t .th-cost-s{display:inline}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>天堂經典版 天幣監測</h1>
      <span class="sub" id="updated">資料載入中…</span>
      <span class="sub" id="tick"></span>
    </div>
    <div class="bar">
      <span id="stats" style="display:contents"></span>
      <select id="serverFilter" aria-label="伺服器"></select>
      <select id="sortBy" aria-label="排序">
        <option value="desc">淨利率高→低</option>
        <option value="asc">淨利率低→高</option>
        <option value="server">依伺服器</option>
      </select>
      <span class="legend">顏色：<span class="sw tier1">≥20%</span><span class="sw tier2">10–20%</span><span class="sw tier3">5–10%</span><span class="sw tier4">2.5–5%</span></span>
    </div>
    <div id="banners"></div>
    <div id="list"></div>
    <details class="refs" id="refsBox">
      <summary>8591 參考價明細（銷量前三中間價）</summary>
      <div id="refs"></div>
    </details>
    <footer>
      價格單位：台幣／萬。成本已含 DD373 遊戲幣交易稅 3%（買方付），淨利已扣 8591 的 6% 手續費。「最少」只在可部分結算的單出現（至少要買一半）。下單前請核對伺服器與收貨資訊。
      資料由 GitHub 每 10 分鐘自動更新（排程偶爾會晚 10–30 分鐘），頁面每 60 秒重新讀取。
    </footer>
  </div>
  <script>
    const DATA_URL = "data.json";
    const STALE_SEC = 25 * 60;
    let data = null;
    let remain = 60;

    const $ = (id) => document.getElementById(id);

    function fmtNum(v, n) {
      if (typeof v !== "number" || Number.isNaN(v)) return "—";
      return v.toFixed(n == null ? 2 : n);
    }
    function fmtStock(v) {
      if (typeof v !== "number" || Number.isNaN(v)) return "—";
      if (Math.abs(v - Math.round(v)) < 1e-6) return String(Math.round(v));
      return String(v);
    }
    function minBuyText(h) {
      if (h["部分結算"] === false) return "";
      const label = h["最少要買"];
      if (!label || label === "整批" || label === "—") return "";
      return label + " 萬";
    }
    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function relTime(ts) {
      if (!ts) return "";
      const sec = Math.max(0, (Date.now() / 1000) - ts);
      if (sec < 30) return "剛剛";
      if (sec < 60) return Math.floor(sec) + " 秒前";
      if (sec < 3600) return Math.floor(sec / 60) + " 分鐘前";
      return Math.floor(sec / 3600) + " 小時前";
    }

    function tierOf(rate) {
      if (rate >= 20) return "tier1";
      if (rate >= 10) return "tier2";
      if (rate >= 5) return "tier3";
      return "tier4";
    }
    function currentHits() {
      const hits = (data && data.hits ? data.hits.slice() : []);
      const server = $("serverFilter").value;
      const mode = $("sortBy").value;
      const list = server ? hits.filter((h) => h["伺服器"] === server) : hits;
      if (mode === "server") {
        const best = {};
        for (const h of list) best[h["伺服器"]] = Math.max(best[h["伺服器"]] || -1e9, h["淨利率"]);
        list.sort((a, b) => (best[b["伺服器"]] - best[a["伺服器"]]) ||
          a["伺服器"].localeCompare(b["伺服器"], "zh-Hant") || b["淨利率"] - a["淨利率"]);
      } else {
        const desc = mode !== "asc";
        list.sort((a, b) => desc ? b["淨利率"] - a["淨利率"] : a["淨利率"] - b["淨利率"]);
      }
      return list;
    }

    function renderBanners() {
      const el = $("banners");
      const parts = [];
      const errors = (data && data.errors) || [];
      if (errors.length) {
        parts.push(
          '<div class="banner error"><b>這一輪抓取有狀況</b><ul>' +
          errors.map((e) => "<li>" + escapeHtml(e) + "</li>").join("") +
          "</ul></div>"
        );
      }
      if (data && data.updated_at_ts) {
        const age = (Date.now() / 1000) - data.updated_at_ts;
        if (age > STALE_SEC) {
          parts.push('<div class="banner warn">資料已超過 25 分鐘未更新，GitHub 排程可能延遲，稍後會自動補上。</div>');
        }
      } else if (data && !data.updated_at) {
        parts.push('<div class="banner warn">還沒有完整結果，正在等監測跑完第一輪。</div>');
      }
      el.innerHTML = parts.join("");
    }

    function renderStats() {
      const fee = data ? Number(data.fee_8591 || 0) * 100 : 6;
      const tax = data ? Number(data.game_tax || 0) * 100 : 3;
      const min = data ? Number(data.min_net_rate || 0) * 100 : 2.5;
      const hits = data ? data.hit_count || 0 : 0;
      const servers = data ? data.server_count || 0 : 0;
      $("stats").innerHTML = [
        '<div class="chip">符合 <b>' + hits + "</b> 筆</div>",
        '<div class="chip">伺服器 <b>' + servers + "</b> 區</div>",
        '<div class="chip">門檻 <b>' + fmtNum(min, 1) + "%</b></div>",
        '<div class="chip">已扣 8591 手續費 <b>' + fmtNum(fee, 0) + "%</b></div>",
        '<div class="chip">遊戲幣交易稅 <b>' + fmtNum(tax, 0) + "%</b></div>",
      ].join("");
    }

    function renderFilter() {
      const sel = $("serverFilter");
      const prev = sel.value;
      const names = new Set();
      for (const h of (data && data.hits) || []) names.add(h["伺服器"]);
      const list = Array.from(names).sort(function (a, b) { return a.localeCompare(b, "zh-Hant"); });
      const opts = ['<option value="">全部伺服器</option>']
        .concat(list.map((n) => '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + "</option>"));
      sel.innerHTML = opts.join("");
      if (prev && list.indexOf(prev) >= 0) sel.value = prev;
    }

    function rowHtml(h, prevServer, grouped) {
      const rate = Number(h["淨利率"] || 0);
      const tier = tierOf(rate);
      const url = h["網址"] || "";
      const link = url ? '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">開啟</a>' : "";
      const name = h["伺服器"];
      const same = grouped && prevServer === name;
      return '<tr class="row-' + tier + (grouped && !same && prevServer !== null ? " newsrv" : "") + '">' +
        '<td class="srv">' + (same ? '<span class="dim">〃</span>' : escapeHtml(name)) + "</td>" +
        '<td class="rate"><span class="' + tier + '">' + fmtNum(rate, 1) + "%</span></td>" +
        '<td class="num"><b>' + fmtNum(h["每萬淨利_TWD"]) + "</b></td>" +
        '<td class="num cost">' + fmtNum(h["含稅成本_TWD每萬"]) + ' <span class="dim">→</span> ' + fmtNum(h["8591參考價_TWD每萬"]) + "</td>" +
        '<td class="num hide-sm">' + fmtStock(h["庫存_萬金"]) + "</td>" +
        '<td class="num min">' + escapeHtml(minBuyText(h)) + "</td>" +
        "<td>" + link + "</td></tr>";
    }
    function tableHtml(rows, grouped) {
      let prev = null;
      const body = rows.map(function (h) { const r = rowHtml(h, prev, grouped); prev = h["伺服器"]; return r; }).join("");
      return '<table class="t"><thead><tr><th>伺服器</th><th class="num">淨利率</th><th class="num">每萬淨利</th>' +
        '<th class="num"><span class="th-cost-l">含稅成本 → 8591</span><span class="th-cost-s">成本→8591</span></th><th class="num hide-sm">庫存(萬)</th><th class="num">最少</th><th>連結</th></tr></thead><tbody>' +
        body + "</tbody></table>";
    }
    function renderList() {
      const rows = currentHits();
      const box = $("list");
      if (!data || !data.updated_at) {
        box.className = ""; box.innerHTML = '<div class="empty">尚無資料，請稍候再看。</div>';
        return;
      }
      if (!rows.length) {
        box.className = ""; box.innerHTML = '<div class="empty">這一輪沒有達到門檻的單。</div>';
        return;
      }
      const grouped = $("sortBy").value === "server";
      const two = window.innerWidth >= 1100 && rows.length > 12;
      box.className = two ? "two" : "";
      if (two) {
        const half = Math.ceil(rows.length / 2);
        box.innerHTML = tableHtml(rows.slice(0, half), grouped) + tableHtml(rows.slice(half), grouped);
      } else {
        box.innerHTML = tableHtml(rows, grouped);
      }
    }

    function renderRefs() {
      const refs = (data && data.refs) || {};
      const names = Object.keys(refs).sort(function (a, b) { return a.localeCompare(b, "zh-Hant"); });
      const src = data && data.ref_source ? escapeHtml(data.ref_source) : "";
      const when = data && data.ref_fetched_at ? escapeHtml(data.ref_fetched_at) + "（台北時間）" : "—";
      if (!names.length) {
        $("refs").innerHTML = '<p class="sub">尚無參考價資料。</p>';
        return;
      }
      const items = names.map(function (name) {
        const r = refs[name] || {};
        const top = r.top || [];
        const twds = top.map(function (x) { return Number(x.twd); }).filter(function (n) { return !Number.isNaN(n); });
        let warn = "";
        if (twds.length >= 2) {
          const mx = Math.max.apply(null, twds), mn = Math.min.apply(null, twds);
          if (mn > 0 && mx / mn >= 1.2) {
            warn = '<div class="note-wide">這區前三名價差較大，參考價可能被較貴的賣家拉高，下單前請再到 8591 核對。</div>';
          }
        }
        const rows = top.map(function (x) {
          return "<tr><td>" + fmtNum(x.rate, 0) + " 幣/元</td><td>每萬 " +
            fmtNum(x.twd) + "</td><td>銷量 " + fmtStock(x.sell_count) + "</td></tr>";
        }).join("");
        return (
          '<div class="ref-item"><h3>' + escapeHtml(name) + "</h3>" +
          '<div class="median">中間價每萬 <b>' + fmtNum(r.ref_twd) + "</b></div>" +
          "<table><thead><tr><th>比值</th><th>台幣</th><th>銷量</th></tr></thead><tbody>" +
          rows + "</tbody></table>" + warn + "</div>"
        );
      }).join("");
      $("refs").innerHTML =
        '<p class="sub">更新：' + when + (src ? "｜" + src : "") + "</p>" + items;
    }

    function render() {
      if (data && data.updated_at) {
        $("updated").innerHTML = "更新時間 <strong>" + escapeHtml(data.updated_at) +
          "</strong>（台北時間）· " + relTime(data.updated_at_ts);
      } else {
        $("updated").textContent = "尚無更新時間";
      }
      renderBanners();
      renderStats();
      renderFilter();
      renderList();
      renderRefs();
    }

    async function load() {
      try {
        const res = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        data = await res.json();
        render();
      } catch (err) {
        $("banners").innerHTML =
          '<div class="banner error">無法載入最新資料（' + escapeHtml(err.message) + "），仍顯示上次內容。</div>" +
          $("banners").innerHTML;
      }
      remain = 60;
    }

    $("serverFilter").addEventListener("change", renderList);
    $("sortBy").addEventListener("change", renderList);
    let lastTwo = window.innerWidth >= 1100;
    window.addEventListener("resize", function () {
      const now = window.innerWidth >= 1100;
      if (now !== lastTwo) { lastTwo = now; renderList(); }
    });
    setInterval(function () {
      remain -= 1;
      if (remain <= 0) {
        remain = 60;
        load();
      }
      $("tick").textContent = "· " + remain + " 秒後重新讀取";
    }, 1000);
    load();
  </script>
</body>
</html>
