name: loop
# 每 ~60 分鐘跑一輪 monitor.py + dd373_live.py，資料推到 live 分支，再觸發 deploy.yml 發布 Pages。
# 跑約 5 小時 40 分後自己再叫一次 loop.yml（GITHUB_TOKEN 可觸發 workflow_dispatch），接在 6 小時上限之前。
on:
  workflow_dispatch:
    inputs:
      probe:
        description: '只跑一輪測試（不發布、不推資料、不接力）'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: loop
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Taipei
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DD373_CHROME_CHANNEL: chrome
      DD373_HEADLESS: '0'
      RUN_MINUTES: '340'
      ROUND_SECONDS: '3600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: install
        run: pip install -q requests beautifulsoup4 lxml playwright > /dev/null 2>&1 || true
      - name: restore last data from live branch
        run: |
          if git fetch -q --depth 1 origin live 2>/dev/null; then
            mkdir -p site/history
            for f in site/data.json site/dd373/data.json ref_8591.json dd373_rate.json state.json site/history/victory.json; do
              git show FETCH_HEAD:$f > /tmp/r 2>/dev/null && mv /tmp/r $f || true
            done
            echo "restored from live"
          fi
      - name: probe (one round, no publish)
        if: ${{ inputs.probe }}
        run: |
          rm -f ref_8591.json   # 強制重抓 8591，確認有沒有被擋
          timeout 150 python -u monitor.py > out.txt 2>&1 || true
          timeout 360 xvfb-run -a python -u dd373_live.py > dd373_out.txt 2>&1 || true
          python - <<'PY'
          import json
          try: refs=len(json.load(open('ref_8591.json')).get('servers') or {})
          except Exception: refs=0
          a=json.load(open('site/data.json')); b=json.load(open('site/dd373/data.json'))
          errs=a.get('errors') or []
          site_ok='SITE_OK' in open('out.txt',encoding='utf-8',errors='ignore').read()
          dd373_ok=sum(1 for r in b.get('rows',[]) if r.get('tag')!='error' and r.get('avg')) if b.get('ok') else 0
          ok = refs>=15 and site_ok and dd373_ok>=7
          print("PROBE", "OK" if ok else "BLOCKED", "8591_refs", refs, "hits", a.get('hit_count'), "8591page_written", site_ok, "8591page_errors", len(errs), "dd373_ok_servers", dd373_ok, "dd373_status", str(b.get('status'))[:80])
          for e in errs[:5]: print("  err:", str(e)[:120])
          import re, monitor
          sid, name = next(iter(monitor.SERVERS_8591.items()))
          st, _, html = monitor.http_get(f"https://www.8591.com.tw/v3/mall/list/68065?ware_type=0&sell_sort=1&server_id={sid}", 25, referer="https://www.8591.com.tw/")
          m = re.search(r'<script[^>]*id="__NUXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
          raw = m.group(1) if m else ''
          t = re.search(r'<title>(.*?)</title>', html, re.S)
          print("DIAG8591", name, "http", st, "len", len(html), "nuxt", len(raw), "ware_title", raw.count('ware_title'), "parsed", len(monitor.parse_8591_listings(html, sid, name)), "title", (t.group(1).strip()[:60] if t else ''))
          PY
      - name: run loop
        if: ${{ !inputs.probe }}
        run: |
          set +e
          echo "LOOP_T0=$(date +%s)" >> "$GITHUB_ENV"
          FILES="site/data.json site/dd373/data.json ref_8591.json dd373_rate.json state.json site/history/victory.json"
          end=$(( $(date +%s) + RUN_MINUTES*60 ))
          n=0
          while [ "$(date +%s)" -lt "$end" ]; do
            t0=$(date +%s); n=$((n+1))
            # 拿 main 上最新的程式（只換程式檔，資料檔不動）
            if git fetch -q --depth 1 origin main 2>/dev/null; then
              git checkout -q FETCH_HEAD -- monitor.py dd373_live.py config.json history.py 2>/dev/null || true
            fi
            timeout 120 python -u monitor.py > out.txt 2>&1 || true
            timeout 360 xvfb-run -a python -u dd373_live.py > dd373_out.txt 2>&1 || true
            timeout 30 python -u history.py > history_out.txt 2>&1 || true
            tail -n 3 history_out.txt 2>/dev/null || true
            python - <<'PY' || true
          import json
          a=json.load(open('site/data.json')); b=json.load(open('site/dd373/data.json'))
          print("8591", a.get('updated_at'), "hits", a.get('hit_count'), "errors", len(a.get('errors') or []), "| dd373", b.get('updated_at'), "ok", b.get('ok'))
          PY
            if grep -Eiq 'discord(app)?\.com/api/webhooks|ghp_|gho_|ghs_|github_pat_' $FILES site/index.html site/dd373/index.html 2>/dev/null; then
              echo "secret-like text found, skip publish"
            else
              export GIT_INDEX_FILE=/tmp/live.idx; rm -f $GIT_INDEX_FILE
              for f in $FILES; do
                [ -f "$f" ] && git update-index --add --cacheinfo 100644,$(git hash-object -w "$f"),"$f"
              done
              tree=$(git write-tree); unset GIT_INDEX_FILE
              c=$(GIT_AUTHOR_NAME=github-actions[bot] GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com \
                  GIT_COMMITTER_NAME=github-actions[bot] GIT_COMMITTER_EMAIL=41898282+github-actions[bot]@users.noreply.github.com \
                  git commit-tree $tree -m "live $(date '+%F %T')")
              if git push -q -f origin "$c:refs/heads/live"; then
                gh workflow run deploy.yml -R "$REPO" --ref main > /dev/null 2>&1 || echo "deploy dispatch failed"
              else
                echo "push live failed"
              fi
            fi
            # 每輪（約 60 分）把資料也存回 main 一次（備份；網站不靠它）
            git add site/data.json site/dd373/data.json ref_8591.json dd373_rate.json site/history/victory.json
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -q -m "data $(date '+%F %T')" || true
            git push -q origin HEAD:main || (git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main) || true
            left=$(( ROUND_SECONDS - ($(date +%s) - t0) ))
            if [ "$left" -gt 0 ]; then sleep "$left"; fi
          done
          exit 0
      - name: hand over to next loop
        if: ${{ !cancelled() && !inputs.probe }}
        run: |
          # 跑不到 30 分鐘就結束代表有問題，不自動重啟（避免無限重開）；由 monitor.yml 排程 / 守護例行補啟
          if [ $(( $(date +%s) - ${LOOP_T0:-0} )) -gt 1800 ]; then gh workflow run loop.yml -R "$REPO" --ref main; else echo "loop ended early, not re-dispatching"; fi
