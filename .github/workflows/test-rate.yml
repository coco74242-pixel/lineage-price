name: test-rate (temporary)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - env: {TZ: Asia/Taipei}
        run: |
          pip install -q requests beautifulsoup4 lxml playwright > /dev/null 2>&1
          curl -s -m 20 -o /tmp/c.txt -w "csv http %{http_code}\n" https://rate.bot.com.tw/xrt/flcsv/0/day; head -c 150 /tmp/c.txt; echo
          cat > /tmp/t.py <<'PY'
          import sys; sys.path.insert(0,'.')
          import dd373_live as m
          m.RATE_JSON='/tmp/rate_test.json'
          try:
              m.fetch_bot_rate(); print(open('/tmp/rate_test.json').read())
          except Exception as e: print('FAIL', e)
          PY
          echo headless; python /tmp/t.py
          echo headful-xvfb; DD373_HEADLESS=0 xvfb-run -a python /tmp/t.py
