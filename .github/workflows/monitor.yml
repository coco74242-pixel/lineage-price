name: monitor
# 備援／啟動器：排程或手動觸發時，如果沒有 loop 在跑，就啟動 loop.yml（約每 30 分鐘一輪）。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: start loop if none running
        run: |
          n=$(gh run list -R "$REPO" -w loop.yml -L 20 --json status --jq '[.[]|select(.status!="completed")]|length')
          echo "active loop runs: $n"
          if [ "$n" = "0" ]; then gh workflow run loop.yml -R "$REPO" --ref main && echo "loop started"; fi
