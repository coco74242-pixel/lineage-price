name: deploy
# 由 loop.yml 每輪觸發：main 的網頁 + live 分支的最新資料 → GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: overlay live data
        run: |
          git fetch -q --depth 1 origin live
          for f in site/data.json site/dd373/data.json; do git show FETCH_HEAD:$f > $f; done
          # 匯率給 Google 試算表 IMPORTDATA 用（只取 data.json 裡的 rate，不改抓取邏輯）
          python3 -c "import json;r=json.load(open('site/dd373/data.json')).get('rate');open('site/dd373/rate.csv','w').write(str(r) if isinstance(r,(int,float)) and 3<r<7 else '')"
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
