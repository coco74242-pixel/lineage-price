name: deploy
# 由 loop.yml 每輪觸發：main 的網頁 + live 分支的最新資料 → GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: overlay live data
        run: |
          git fetch -q --depth 1 origin live
          git show FETCH_HEAD:site/dd373/data.json > site/dd373/data.json
          rm -f site/data.json   # 8591 頁面已移除
          # 價格曲線歷史與價格紀錄 CSV：live 有就蓋上去，沒有就保留 main 上的檔
          mkdir -p site/history site/dd373
          for f in victory.json niuren.json mars.json hephaestus.json cupid.json medusa.json hades.json cerberus.json hera.json poseidon.json; do
            git show FETCH_HEAD:site/history/$f > /tmp/$f 2>/dev/null && mv /tmp/$f site/history/$f || true
          done
          git show FETCH_HEAD:site/dd373/price_log.csv > /tmp/price_log.csv 2>/dev/null && mv /tmp/price_log.csv site/dd373/price_log.csv || true
          # 匯率給 Google 試算表 IMPORTDATA 用（只取 data.json 裡的 rate，不改抓取邏輯）
          python3 -c "import json;r=json.load(open('site/dd373/data.json')).get('rate');open('site/dd373/rate.csv','w').write(str(r) if isinstance(r,(int,float)) and 3<r<7 else '')"
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
